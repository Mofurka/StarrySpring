<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<body>
<title>Редактор погоды · Irden</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{
  --paper:#eef2f6; --panel:#ffffff; --panel-2:#f6f9fb; --ink:#12202b; --muted:#5f7285;
  --line:#d5dee6; --line-2:#e6edf2; --accent:#1f8fb8; --accent-ink:#0c5e79; --accent-soft:#dceef4;
  --ok:#2f9e5b; --warn:#c1841f; --crit:#cf4b3a;
  --ok-soft:#e2f3e8; --warn-soft:#f7ecd6; --crit-soft:#f7e2de;
  --shadow:0 1px 2px rgba(18,32,43,.06), 0 6px 20px rgba(18,32,43,.06);
  --mono:ui-monospace,"Cascadia Code","SF Mono",Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme:dark){
  :root{
    --paper:#0b131b; --panel:#111d27; --panel-2:#0e1922; --ink:#dce7ef; --muted:#8498a8;
    --line:#233543; --line-2:#1a2833; --accent:#46b3d8; --accent-ink:#9bd9ec; --accent-soft:#12303c;
    --ok:#4bb673; --warn:#d99f3c; --crit:#e06553;
    --ok-soft:#123024; --warn-soft:#2f2718; --crit-soft:#301c18;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
  }
}
:root[data-theme="light"]{
  --paper:#eef2f6; --panel:#ffffff; --panel-2:#f6f9fb; --ink:#12202b; --muted:#5f7285;
  --line:#d5dee6; --line-2:#e6edf2; --accent:#1f8fb8; --accent-ink:#0c5e79; --accent-soft:#dceef4;
  --ok:#2f9e5b; --warn:#c1841f; --crit:#cf4b3a; --ok-soft:#e2f3e8; --warn-soft:#f7ecd6; --crit-soft:#f7e2de;
  --shadow:0 1px 2px rgba(18,32,43,.06), 0 6px 20px rgba(18,32,43,.06);
}
:root[data-theme="dark"]{
  --paper:#0b131b; --panel:#111d27; --panel-2:#0e1922; --ink:#dce7ef; --muted:#8498a8;
  --line:#233543; --line-2:#1a2833; --accent:#46b3d8; --accent-ink:#9bd9ec; --accent-soft:#12303c;
  --ok:#4bb673; --warn:#d99f3c; --crit:#e06553; --ok-soft:#123024; --warn-soft:#2f2718; --crit-soft:#301c18;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
.mono{font-family:var(--mono)}
.num{font-variant-numeric:tabular-nums}
button{font-family:inherit;font-size:inherit;cursor:pointer;color:inherit}
input,select,textarea{font-family:inherit;font-size:13px;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:5px 8px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea{resize:vertical;line-height:1.45}
a{color:var(--accent-ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---- shell ---- */
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:14px;padding:10px 18px;
  background:color-mix(in srgb,var(--panel) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;gap:9px;margin-right:auto;min-width:0}
.brand b{font-weight:650;letter-spacing:-.01em}
.brand .sub{color:var(--muted);font-size:12px;font-family:var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbtn{display:inline-flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 11px;font-size:13px;font-weight:550;transition:border-color .15s,background .15s}
.tbtn:hover{border-color:var(--accent)}
.tbtn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.tbtn.primary:hover{filter:brightness(1.06)}
.tbtn.ghost{background:transparent}
.badge{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:12px;font-weight:600;padding:5px 9px;border-radius:20px;border:1px solid transparent}
.badge.ok{background:var(--ok-soft);color:var(--ok);border-color:color-mix(in srgb,var(--ok) 30%,transparent)}
.badge.bad{background:var(--crit-soft);color:var(--crit);border-color:color-mix(in srgb,var(--crit) 30%,transparent)}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor}

.layout{display:grid;grid-template-columns:210px minmax(0,1fr);gap:0;align-items:start}
.rail{position:sticky;top:53px;align-self:start;padding:16px 12px;border-right:1px solid var(--line);min-height:calc(100vh - 53px)}
.rail nav{display:flex;flex-direction:column;gap:2px}
.rail a{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;border-radius:8px;color:var(--ink);text-decoration:none;font-weight:550;font-size:13px;border:1px solid transparent}
.rail a:hover{background:var(--panel-2)}
.rail a.active{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 25%,transparent);color:var(--accent-ink)}
.rail a .c{font-family:var(--mono);font-size:11px;color:var(--muted)}
.rail a.active .c{color:var(--accent-ink)}
.rail .eyebrow{font-family:var(--mono);text-transform:uppercase;letter-spacing:.09em;font-size:10px;color:var(--muted);margin:14px 10px 6px}
.vlist{display:flex;flex-direction:column;gap:5px;margin:0 2px}
.vitem{display:flex;gap:7px;font-size:12px;line-height:1.35;padding:6px 8px;border-radius:7px;background:var(--panel-2)}
.vitem .k{flex:0 0 auto;width:4px;border-radius:3px;align-self:stretch}
.vitem.err .k{background:var(--crit)} .vitem.warn .k{background:var(--warn)}
.vitem b{font-family:var(--mono);font-weight:600}
.vclean{font-size:12px;color:var(--muted);padding:6px 8px}

.main{padding:20px 22px 80px;max-width:1180px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
h2.sec{font-size:19px;font-weight:640;letter-spacing:-.01em;margin:0 0 3px;text-wrap:balance}
.sec-lead{color:var(--muted);font-size:13px;margin:0 0 16px;max-width:64ch}
.eyebrow{font-family:var(--mono);text-transform:uppercase;letter-spacing:.1em;font-size:10.5px;color:var(--accent-ink);font-weight:600}

/* ---- graph ---- */
.graphwrap{position:relative;border-radius:var(--r);overflow:hidden;background:
  radial-gradient(circle at 50% 46%, color-mix(in srgb,var(--accent) 7%,transparent), transparent 60%), var(--panel);
  border:1px solid var(--line)}
.graphwrap svg{display:block;width:100%;height:auto;touch-action:none}
.gnode{cursor:pointer}
.gnode text{font-family:var(--mono);font-size:15px;paint-order:stroke;stroke:var(--panel);stroke-width:3.5px;stroke-linejoin:round}
.gtip{position:absolute;pointer-events:none;z-index:5;background:var(--ink);color:var(--paper);font-size:12px;line-height:1.4;
  padding:8px 10px;border-radius:8px;max-width:260px;box-shadow:var(--shadow);opacity:0;transform:translateY(3px);transition:opacity .12s}
.gtip .t{font-family:var(--mono);font-weight:600;margin-bottom:3px}
.gtip.show{opacity:1;transform:none}
.glegend{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;padding:11px 14px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.glegend .swatch{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.gtoolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{background:var(--panel);border:0;padding:6px 11px;font-size:12.5px;font-weight:550;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--accent-soft);color:var(--accent-ink)}

/* ---- forms / cards ---- */
.grid{display:grid;gap:14px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>label{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.field .hint{font-size:11px;color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.card+.card{margin-top:14px}
.card-head{display:flex;align-items:center;gap:11px;padding:12px 14px;cursor:pointer;user-select:none}
.card-head:hover{background:var(--panel-2)}
.stripe{width:12px;height:34px;border-radius:5px;flex:0 0 auto;border:1px solid rgba(0,0,0,.12)}
.card-title{display:flex;flex-direction:column;gap:1px;min-width:0;margin-right:auto}
.card-title .id{font-family:var(--mono);font-weight:650;font-size:15px;letter-spacing:-.01em}
.card-title .meta{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-body{padding:4px 14px 16px;border-top:1px solid var(--line-2);display:none}
.card.open .card-body{display:block}
.card.open .chev{transform:rotate(90deg)}
.chev{color:var(--muted);transition:transform .15s;flex:0 0 auto}

.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:12px;padding:3px 5px 3px 9px;border-radius:20px;background:var(--panel-2);border:1px solid var(--line)}
.chip button{border:0;background:transparent;color:var(--muted);font-size:14px;line-height:1;padding:0 2px}
.chip button:hover{color:var(--crit)}
.chip.tag{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 22%,transparent);color:var(--accent-ink)}
.chip.add{cursor:text;padding-left:9px}
.chip.add input{border:0;background:transparent;padding:2px 0;width:80px}
.chip.add input:focus{box-shadow:none}
.pill{font-family:var(--mono);font-size:10.5px;font-weight:600;padding:2px 7px;border-radius:20px;text-transform:uppercase;letter-spacing:.04em}
.pill.danger{background:var(--crit-soft);color:var(--crit)}
.pill.special{background:var(--warn-soft);color:var(--warn)}

.subhead{display:flex;align-items:center;gap:8px;margin:16px 0 8px}
.subhead h4{margin:0;font-size:12px;font-family:var(--mono);text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.subhead .line{flex:1;height:1px;background:var(--line-2)}
.mini{font-size:12px;font-weight:600;color:var(--accent-ink);background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 22%,transparent);border-radius:7px;padding:4px 9px}
.mini:hover{filter:brightness(.97)}
.iconbtn{border:1px solid var(--line);background:var(--panel);border-radius:7px;width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;color:var(--muted)}
.iconbtn:hover{border-color:var(--crit);color:var(--crit)}

.trow{border:1px solid var(--line);border-radius:9px;padding:10px;margin-bottom:9px;background:var(--panel-2)}
.trow .thead{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.wbar{height:6px;border-radius:4px;background:var(--accent);opacity:.75;min-width:3px}
.cond{margin-top:9px;padding-top:9px;border-top:1px dashed var(--line);display:grid;gap:10px}
.kv{display:grid;grid-template-columns:1fr auto auto auto;gap:6px;align-items:center}
.kv .rng{display:flex;gap:5px}
.kv input{width:100%}
.tinyhead{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}

table.periods{width:100%;border-collapse:collapse;font-size:13px}
table.periods th{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-align:left;font-weight:600;padding:0 8px 8px}
table.periods td{padding:5px 8px;border-top:1px solid var(--line-2)}
table.periods input{width:100%}
.clock{display:flex;height:30px;border-radius:8px;overflow:hidden;border:1px solid var(--line);margin-top:6px}
.clock .seg-h{flex:1;display:flex;align-items:center;justify-content:center;font-size:9px;font-family:var(--mono);color:#fff;border-right:1px solid rgba(255,255,255,.18);min-width:0;overflow:hidden}
.clock .seg-h.gap{background:repeating-linear-gradient(45deg,var(--crit),var(--crit) 5px,#0000 5px,#0000 10px)}

.pcard{border:1px solid var(--line);border-radius:9px;padding:11px;background:var(--panel-2);margin-bottom:9px}
.swatch-in{display:flex;align-items:center;gap:8px}
.swatch-box{width:26px;height:26px;border-radius:6px;border:1px solid var(--line);flex:0 0 auto}
.textlines{display:flex;flex-direction:column;gap:6px}
.imglink{font-size:11px;font-family:var(--mono)}

.jsonarea{width:100%;min-height:60vh;font-family:var(--mono);font-size:12px;line-height:1.5;white-space:pre;overflow:auto}
.statrow{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px;box-shadow:var(--shadow)}
.stat .v{font-family:var(--mono);font-size:20px;font-weight:650;font-variant-numeric:tabular-nums}
.stat .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-family:var(--mono)}
.abar{display:grid;grid-template-columns:118px 1fr 118px 108px;gap:12px;align-items:center;padding:5px 0}
.abar .name{font-family:var(--mono);font-size:12.5px}
.abar .track{position:relative;height:15px;border-radius:8px;background:var(--panel-2);border:1px solid var(--line)}
.abar .band{position:absolute;top:0;bottom:0;background:color-mix(in srgb,var(--accent) 28%,transparent);border-radius:8px}
.abar .mean{position:absolute;top:-3px;bottom:-3px;width:2.5px;background:var(--accent);border-radius:2px}
.abar .nums{font-family:var(--mono);font-size:11px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.sbar{display:grid;grid-template-columns:150px 1fr 78px 78px;gap:10px;align-items:center;padding:3px 0}
.sbar .id{font-family:var(--mono);font-size:12.5px;display:flex;gap:7px;align-items:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sbar .sw{width:11px;height:11px;border-radius:3px;flex:0 0 auto;border:1px solid rgba(0,0,0,.15)}
.sbar .track{height:15px;border-radius:5px;background:var(--panel-2);overflow:hidden;border:1px solid var(--line-2)}
.sbar .fill{height:100%;border-radius:5px}
.sbar .pct{font-family:var(--mono);font-size:12px;text-align:right;font-variant-numeric:tabular-nums}
.simbadge{font-family:var(--mono);font-size:10px;font-weight:600;padding:2px 7px;border-radius:20px;white-space:nowrap}
.simbadge.ok{background:var(--ok-soft);color:var(--ok)} .simbadge.warn{background:var(--warn-soft);color:var(--warn)} .simbadge.crit{background:var(--crit-soft);color:var(--crit)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(10px);background:var(--ink);color:var(--paper);
  padding:10px 16px;border-radius:9px;font-size:13px;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:.2s;z-index:60}
.toast.show{opacity:1;transform:translateX(-50%)}
.modal-ov{position:fixed;inset:0;z-index:80;background:rgba(8,15,22,.55);display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;transition:opacity .12s}
.modal-ov.show{opacity:1}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);width:min(430px,100%);padding:18px}
.modal h3{margin:0 0 6px;font-size:16px;font-weight:620}
.modal p{margin:0 0 13px;color:var(--muted);font-size:13px}
.modal input{width:100%;margin-bottom:15px}
.modal .actions{display:flex;justify-content:flex-end;gap:8px}
.empty{color:var(--muted);font-size:13px;font-style:italic;padding:6px 0}

@media (max-width:820px){
  .layout{grid-template-columns:1fr}
  .rail{position:static;border-right:0;border-bottom:1px solid var(--line);min-height:0;padding:12px}
  .rail nav{flex-direction:row;flex-wrap:wrap}
  .rail .eyebrow,.rail .vlist,.rail .vclean{display:none}
  .main{padding:16px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="topbar">
  <div class="brand">
    <b>Редактор погоды</b>
    <span class="sub" id="filelabel">weather-system.json</span>
  </div>
  <span id="vbadge" class="badge ok"><span class="dot"></span><span id="vtext">проверка…</span></span>
  <button class="tbtn ghost" id="btn-theme" title="Тема">◐</button>
  <button class="tbtn" id="btn-import">Импорт</button>
  <button class="tbtn" id="btn-reset" title="Загрузить встроенный пример">Пример</button>
  <button class="tbtn primary" id="btn-export">Экспорт JSON</button>
</div>

<div class="layout">
  <aside class="rail">
    <nav id="nav"></nav>
    <div class="eyebrow">Проверка</div>
    <div class="vlist" id="vlist"></div>
  </aside>
  <main class="main" id="main"></main>
</div>

<div class="toast" id="toast"></div>
<input type="file" id="fileinput" accept="application/json,.json" style="display:none">

оиском трав, охотиться и рыбачить. Прокинув средний порог выносливости, вы не заболеете.**"]},{"weight":1.0,"color":"0x71799b","image":"https://cdn.discordapp.com/attachments/539447933062479902/1127555972852875404/night_rain.jpg","text":[":ocean: *Потопный дождь.* Снаружи льёт не просто как из ведра, а льёт так, будто сама Ньефе вас прокляла! Дворики, низменности заполняются водой, устраивая небольшие потопы. Соломенные крыши протекают, а под деревянными крышами и там где были дыры стоит поставить ведро. Помимо этого, звучат, громыхают молнии, пугая всех и вся. Выходить из укрытия крайне опасно. **Во время этой погоды вы не можете заниматься добычей. Находясь в укрытии, вы получаете -2 ко всем броскам, если находитесь не в глубине здания.**"]}]}},"thunder":{"serverWeather":"thunder","tags":["cloudy","thunder"],"allowedPeriods":["day"],"cooldownTicks":6,"duration":{"minTicks":1,"maxTicks":2},"atmosphereChanges":{"cloudiness":0.08,"humidity":0.03,"instability":0.12,"wind":0.04},"transitions":[{"to":"darkcloud","weight":20},{"to":"warm_rain","weight":15},{"to":"storm","weight":12},{"to":"cloudy","weight":12}],"presentations":{"day":[{"weight":7.0,"color":"0x1bcdfa","image":"https://cdn.discordapp.com/attachments/539447933062479902/1127535796702957628/day_rain.jpg","text":[":zap: Летний гром. Где-то из дали вы слышите раскаты грома, что пугает живность и местных пугливых личностей. Дождя однако нет, что несомненно радует. Гулять? Если прихватить с собой беруши. **Во время этой погоды вы не можете охотиться. Не пройдя средний порог решительности, вы получаете -1 ко всем действиям.**"]}]}},"windstorm":{"serverWeather":"windstorm","tags":["wind","storm","dangerous"],"allowedPeriods":["night","day"],"cooldownTicks":0,"duration":{"minTicks":1,"maxTicks":3},"atmosphereChanges":{"wind":0.2,"cloudiness":0.05,"humidity":-0.02,"instability":0.05},"transitions":[{"to":"wind","weight":25},{"to":"darkcloud","weight":18},{"to":"storm","weight":10},{"to":"clear","weight":8}],"presenta ти вне боя и в бою.**"],"stats":{"PER":-3}}]}},"groundmist":{"serverWeather":"groundmist","tags":["fog","wet","post_precipitation"],"allowedPeriods":["dawn"],"cooldownTicks":6,"duration":{"minTicks":1,"maxTicks":3},"atmosphereChanges":{"humidity":-0.03,"groundWetness":-0.02,"wind":-0.08,"temperature":0.2},"transitions":[{"to":"groundmist","weight":15},{"to":"cloudy_wind","weight":10},{"to":"partly_cloudy","weight":22},{"to":"clear","weight":18},{"to":"wind","weight":8}],"presentations":{"dawn":[{"weight":11.6,"color":"0xa2fe7a","image":"https://cdn.discordapp.com/attachments/539447933062479902/1127514042152534108/morning_good.jpg","text":[":white_sun_small_cloud: Поздний восход. Как-то поздно утро начинается, солнце ещё даже не вышло из-за горизонта, и малые облака уже начинают виднеться над вершинами гор. Работа подождёт, ведь сон важнее."]}]}},"firefly":{"serverWeather":"firefly","tags":["clear","special","calm"],"allowedPeriods":["night","sunset"],"cooldownTicks":12,"duration":{"minTicks":1,"maxTicks":2},"atmosphereChanges":{"cloudiness":-0.08,"wind":-0.06,"instability":-0.03},"transitions":[{"to":"clear","weight":24},{"to":"wind","weight":10},{"to":"partly_cloudy","weight":8},{"to":"nighthorror","weight":1}],"presentations":{"sunset":[{"weight":8.0,"color":"0x22ce52","image":"https://cdn.discordapp.com/attachments/539447933062479902/1127536943421472809/dawn_good.jpeg","text":[":sunrise_over_mountains: Закат. Красивый вечерний закат озаряет горные хребты Гризы. Прекрасная погода для простых посиделок прямо под этим самым солнышком. Лучи летнего светила ласкают ваше лицо: пора провести этот вечер с небольшой пользой. **Вы получаете +1 к броскам поиска трав и рыбалки.**"]}],"night":[{"weight":8.0,"color":"0x9aff88","image":"https://cdn.discordapp.com/attachments/539447933062479902/1127549630352195634/night.jpg","text":[":crescent_moon: *Приятная ночь.* Сегодня ночь начинается самым спокойным образом! Тучи разошлись, оставляя озаряющую ночную луну. Ночная прогулка сегодня будет хорошим выбором."]}]}},"nighthorror":{"serverWeather":"nighthorror","tags":["special","horror","dark"],"allowedPeriods":["night","sunset"],"cooldownTicks":12,"duration":{"minTicks":1,"maxTicks":2},"atmosphereChanges":{"cloudiness":0.08,"instability":0.04,"temperature":-0.5},"transitions":[{"to":"clear","weight":16},{"to":"darkcloud","weight":20},{"to":"wind","weight":10},{"to":"firefly","weight":4}],"presentations":{"sunset":[{"weight":5.0,"color":"0x22ce52","image":"https://cdn.discordapp.com/attachments/539447933062479902/1081581544994512956/cloudy_silent.jpg","text":[":interrobang: *Напряженный вечер.* Тишина и неописуемое напряжение. Будучи снаружи, вам хочется поскорее уйти куда-то и спрятаться от чувства наблюдения за вами. Этот вечер точно не для прогулок. **Находясь в лесу, вы должны прокинуть средний порог решительности, чтобы не получить нервоз.**"]}],"night":[{"weight":12.6,"color":"0x525c5c","image":"https://cdn.discordapp.com/attachments/539447933062479902/1081591486396772392/Cloudy.jpg","text":[":black_large_square: *Мрак.* Темнейшая ночь. Сегодня, кажется, стемнело ещё раньше чем обычно.. ночью бродить во время такой погоды будет опасно! Захватите факел или фонарь.  **Во время этой погоды вы получаете -2 к внимательности во время боя и вне.**"],"stats":{"PER":-2}},{"weight":11.6,"color":"0x323838","image":"https://cdn.discordapp.com/attachments/539447933062479902/1127553544174710804/night_special.png","text":[":black_large_square: :question: *Тихий мрак.* Ещё более тёмная погода. Облака застилают ночное небо так плотно, что даже вершин гор не видно с горных низин! Стало не очень приятно бродить снаружи, потому лучше быстрее вернуться домой и лечь спать! **Во время этой погоды вы не можете заниматься активностями, кроме рубки дерева. Вы получаете -3 к решительности во время боя и вне боя если находитесь в одиночестве. Если вы в сопровождении, то получаете только -1 к решительности во время боя и вне боя.**"],"stats":{"DET":-3}}]}},"dayhorr <script>
"use strict";
const $ = (s,r=document)=>r.querySelector(s);
function el(tag, props, ...kids){
  const n=document.createElement(tag);
  for(const k in (props||{})){
    const v=props[k];
    if(k==="class")n.className=v;
    else if(k==="style"&&typeof v==="object")Object.assign(n.style,v);
    else if(k.slice(0,2)==="on"&&typeof v==="function")n.addEventListener(k.slice(2).toLowerCase(),v);
    else if(k==="html")n.innerHTML=v;
    else if(v!==null&&v!==undefined&&v!==false)n.setAttribute(k, v===true?"":v);
  }
  for(const kid of kids.flat()){ if(kid==null||kid===false)continue; n.append(kid.nodeType?kid:document.createTextNode(String(kid))); }
  return n;
}
const clone = o => JSON.parse(JSON.stringify(o));

/* ---------- state ---------- */
let MODEL, TAB="graph", SELECTED=null, SHOW_ALL_EDGES=false, GRAPH_FILTER="all";
const TABS=[["graph","Граф"],["settings","Настройки"],["periods","Периоды"],["states","Состояния"],["global","Глобальные"],["sim","Симуляция"],["json","JSON"]];

function loadDefault(){ return JSON.parse($("#default-config").textContent); }
function boot(){
  try{ MODEL = normalize(loadDefault()); }catch(e){ MODEL = normalize({settings:{},periods:{},states:{},globalTransitions:[]}); }
  render();
}

/* fill missing collections so editing is safe; preserves everything present */
function normalize(m){
  m=m||{}; m.settings=m.settings||{};
  const s=m.settings;
  s.initialAtmosphere=s.initialAtmosphere||{}; s.atmosphereBounds=s.atmosphereBounds||{};
  if(typeof s.historySize!=="number")s.historySize=24;
  if(typeof s.sameStateMultiplier!=="number")s.sameStateMultiplier=1;
  if(!s.defaultState)s.defaultState="";
  m.periods=m.periods||{}; m.states=m.states||{}; m.globalTransitions=m.globalTransitions||[];

/* ---------- color helpers ---------- */
function normHex(c){ if(!c)return null; let x=String(c).trim().toLowerCase(); if(x.startsWith("0x"))x=x.slice(2); if(x.startsWith("#"))x=x.slice(1);
  if(!/^[0-9a-f]{6}$/.test(x))return null; return "#"+x; }
function toStored(hex){ if(!hex)return ""; return "0x"+hex.replace("#","").toLowerCase(); }
function lum(hex){ const h=normHex(hex); if(!h)return .5; const r=parseInt(h.slice(1,3),16)/255,g=parseInt(h.slice(3,5),16)/255,b=parseInt(h.slice(5,7),16)/255;
  return .2126*r+.7152*g+.0722*b; }
const TAGCOLORS={dangerous:"#cf4b3a",storm:"#7c4bd0",horror:"#8a3b64",special:"#c98a2b",magic:"#3aa0c9",precipitation:"#2f76c9",wet:"#3a8fbf",fog:"#8fa3ad",clear:"#e0b13a",dry:"#caa24a",wind:"#5aa38b",cloudy:"#8895a0"};

/* primary node fill from state's own color, fallback to tag color */
function nodeFill(d){ const h=normHex(d.color); if(h)return h; for(const t of (d.tags||[])) if(TAGCOLORS[t])return TAGCOLORS[t]; return "#8895a0"; }

/* ---------- validation ---------- */
function validate(){
  const errs=[], warns=[];
  const S=MODEL.states, P=MODEL.periods, set=MODEL.settings;
  const sids=new Set(Object.keys(S)), pids=new Set(Object.keys(P));
  if(!Object.keys(S).length)errs.push(["states","Не задано ни одного состояния"]);
  if(!set.defaultState)errs.push(["settings","Не задано состояние по умолчанию"]);
  else if(!sids.has(set.defaultState))errs.push(["settings",`Состояние по умолчанию «${set.defaultState}» не существует`]);
  // periods
  if(!Object.keys(P).length)errs.push(["periods","Не задано ни одного периода"]);
  for(const id in P){ const p=P[id];
    if(p.fromHour<0||p.fromHour>23)errs.push(["periods",`Период «${id}»: fromHour вне 0–23`]);
    if(p.toHour<1||p.toHour>24)errs.push(["periods",`Период «${id}»: toHour вне 1–24`]);
    if(p.fromHour===p.toHour)errs.push(["periods",`Период «${id}»: нулевая длительность`]);
  }
  const cover=hourCoverage();
  cover.forEach((n,h)=>{ if(n===0)errs.push(["periods",`Час ${h}:00 не покрыт ни одним периодом`]);
    else if(n>1)errs.push(["periods",`Час ${h}:00 покрыт ${n} периодами (нужен ровно 1)`]); });
  // states
  const incoming=new Set();
  const checkTrans=(list,src)=>{ for(const t of (list||[])){
    if(!t.to||!sids.has(t.to))errs.push(["states",`Переход из «${src}» → «${t.to}» ведёт в неизвестное состояние`]);
    else incoming.add(t.to);
    if(typeof t.weight!=="number"||t.weight<0)errs.push(["states",`Переход «${src}» → «${t.to}»: вес должен быть ≥ 0`]);
    for(const m of (t.modifiers||[])) if(typeof m.multiplier==="number"&&m.multiplier<0)errs.push(["states",`Модификатор «${src}» → «${t.to}»: множитель < 0`]);
    for(const per of ((t.conditions&&t.conditions.periods)||[])) if(!pids.has(per))errs.push(["states",`Условие перехода «${src}» → «${t.to}» ссылается на неизвестный период «${per}»`]);
  }};
  for(const id in S){ const d=S[id];
    if(!d.serverWeather)warns.push(["states",`«${id}»: пустой serverWeather (код для игры)`]);
    for(const per of (d.allowedPeriods||[])) if(!pids.has(per))errs.push(["states",`«${id}»: allowedPeriods ссылается на неизвестный период «${per}»`]);
    for(const per in (d.presentations||{})) if(per!=="*"&&!pids.has(per))errs.push(["states",`«${id}»: презентация для неизвестного периода «${per}»`]);
    if(d.duration&&d.duration.minTicks>d.duration.maxTicks)warns.push(["states",`«${id}»: minTicks > maxTicks (движок подравняет)`]);
    if(!(d.transitions||[]).length&&!MODEL.globalTransitions.length)warns.push(["states",`«${id}»: нет исходящих переходов (тупик)`]);
    checkTrans(d.transitions,id);
  }
  checkTrans(MODEL.globalTransitions,"∀ глобальные");
  for(const id in S){ if(id!==set.defaultState&&!incoming.has(id)){
    const viaGlobal=MODEL.globalTransitions.some(t=>t.to===id);
    if(!viaGlobal)warns.push(["states",`«${id}»: недостижимо (нет входящих переходов)`]);
  }}
  return {errs,warns};
}
function hourCoverage(){ const cover=new Array(24).fill(0);
  for(const id in MODEL.periods){ const p=MODEL.periods[id],f=p.fromHour,t=p.toHour;
    for(let h=0;h<24;h++){ const inside=f<t?(h>=f&&h<t):(h>=f||h<t); if(inside)cover[h]++; } }
  return cover;
}

    const label=svg("text",{x:right?20:-20,y:5,"text-anchor":right?"start":"end",fill:GC.ink});
    label.textContent=id;
    g.append(c,label);
    g.addEventListener("click",e=>{ e.stopPropagation(); SELECTED=(SELECTED===id?null:id); render(); });
    g.addEventListener("mousemove",e=>showTip(tip,e,id,d));
    g.addEventListener("mouseenter",e=>showTip(tip,e,id,d));
    g.addEventListener("mouseleave",()=>tip.classList.remove("show"));
    gNodes.append(g);
  });
  root.addEventListener("click",()=>{ if(SELECTED){SELECTED=null;render();} });
  // center marker for global
  if(sel){ const gm=svg("g",{transform:`translate(${cx},${cy})`});
    gm.append(svg("circle",{r:7,fill:GC.glob,opacity:.5}));
    const tx=svg("text",{x:0,y:4,"text-anchor":"middle",fill:GC.muted,"font-size":"13"}); tx.textContent="∀";
    gm.append(tx); root.append(gm);
  }
  return root;
}
function marker(id,color){ const m=svg("marker",{id,viewBox:"0 0 10 10",refX:"9",refY:"5",markerWidth:"7",markerHeight:"7",orient:"auto-start-reverse"});
  m.append(svg("path",{d:"M0,0 L10,5 L0,10 z",fill:color})); return m; }
function hasCond(t){ return t.conditions&&!isEmptyCond(t.conditions); }
function showTip(tip,e,id,d){

  tip.append(el("div",{class:"t"},id));

  tip.append(el("div",{style:{color:"#9fb4c2",marginTop:"3px"}},`периоды: ${(d.allowedPeriods||[]).join(", ")||"любые"}`));
  tip.append(el("div",{style:{color:"#9fb4c2"}},`длит. ${d.duration.minTicks}–${d.duration.maxTicks}, cooldown ${d.cooldownTicks}`));

/* ---------- TAB: simulation ---------- */
function mulberry32(a){ return function(){ a|=0;a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function simulate(ticks){
  const S=MODEL.states, SET=MODEL.settings, G=MODEL.globalTransitions, B=SET.atmosphereBounds||{};
  const HIST=SET.historySize||24, SAME=SET.sameStateMultiplier||1;
  const start=SET.defaultState;
  if(!start||!S[start])return {error:"Не задано корректное состояние по умолчанию (вкладка «Настройки»)."};
  const cover=hourCoverage(); if(cover.some(n=>n!==1))return {error:"Периоды не покрывают ровно каждый час 0–23. Исправьте на вкладке «Периоды», иначе симуляция недостоверна."};
  const rnd=mulberry32(0x9e3779b9);
  const clampv=(k,v)=>{ const b=B[k]; if(!b)return v; if(b.min!=null)v=Math.max(b.min,v); if(b.max!=null)v=Math.min(b.max,v); return v; };
  const applyAtmo=(atmo,ch)=>{ const a=Object.assign({},atmo); for(const k in (ch||{}))a[k]=clampv(k,(a[k]||0)+ch[k]); return a; };
  const allowed=(d,per)=>{ const ap=d.allowedPeriods||[]; return !ap.length || (per!=null&&ap.includes(per)); };
  const rngOk=(r,v)=>((r.min==null)||v>=r.min)&&((r.max==null)||v<=r.max);
  const histMatch=(tl,c)=>{ const lim=Math.min(Math.max(1,c.withinTicks||1),tl.length);
    for(let i=0;i<lim;i++){ const e=tl[i];
      const anyt=!(c.anyTags&&c.anyTags.length)||c.anyTags.some(t=>e.tags.includes(t));
      const allt=(c.allTags||[]).every(t=>e.tags.includes(t));
      const st=!(c.anyStates&&c.anyStates.length)||c.anyStates.includes(e.stateId);
      if(anyt&&allt&&st)return true; } return false; };
  const condMatch=(c,per,curId,curDef,atmo,history)=>{ if(!c||isEmptyCond(c))return true;
    if((c.periods&&c.periods.length)&&!c.periods.includes(per))return false;
    const tags=curDef.tags||[];
    if((c.currentAnyTags&&c.currentAnyTags.length)&&!c.currentAnyTags.some(t=>tags.includes(t)))return false;
    if(!(c.currentAllTags||[]).every(t=>tags.includes(t)))return false;
    for(const k in (c.atmosphere||{})) if(!rngOk(c.atmosphere[k],atmo[k]||0))return false;
    const tl=[{stateId:curId,tags:tags}].concat(history);
    if(c.recentWeather&&!histMatch(tl,c.recentWeather))return false;
    if(c.absentRecentWeather&&histMatch(tl,c.absentRecentWeather))return false;
    return true; };
  const onCd=(to,tdef,curId,history)=>{ const cd=tdef.cooldownTicks||0; if(cd<=0)return false; if(curId===to)return true;
    const lim=Math.min(cd,history.length); for(let i=0;i<lim;i++) if(history[i].stateId===to)return true; return false; };
  const randDur=d=>{ const a=(d&&d.minTicks)||1,b=Math.max(a,(d&&d.maxTicks)||1); return a>=b?a:a+Math.floor(rnd()*(b-a+1)); };

  const timeIn={},entries={},attempted={},eligible={};
  Object.keys(S).forEach(id=>{timeIn[id]=0;entries[id]=0;});
  const aStat={}; for(const k in B)aStat[k]={min:Infinity,max:-Infinity,sum:0};
  let cur=start, atmo=Object.assign({},SET.initialAtmosphere), rem=randDur(S[cur].duration), history=[], hour=0;
  for(let t=0;t<ticks;t++){
    const per=periodForHour(hour), cdef=S[cur];
    atmo=applyAtmo(atmo,cdef.atmosphereChanges);
    for(const k in aStat){ const v=atmo[k]||0; const s=aStat[k]; if(v<s.min)s.min=v; if(v>s.max)s.max=v; s.sum+=v; }
    timeIn[cur]++;
    history.unshift({stateId:cur,tags:cdef.tags||[]}); if(history.length>HIST)history.length=HIST;
    if(allowed(cdef,per)&&rem>1){ rem--; }
    else{
      const cand={};
      const consider=(rule,key)=>{ const to=rule.to, tdef=S[to]; if(!tdef)return;
        attempted[key]=(attempted[key]||0)+1;
        if(!allowed(tdef,per))return; if(onCd(to,tdef,cur,history))return;
        if(!condMatch(rule.conditions,per,cur,cdef,atmo,history))return;
        eligible[key]=(eligible[key]||0)+1;
        let w=rule.weight||0;
        for(const m of (rule.modifiers||[])) if(condMatch(m.condition,per,cur,cdef,atmo,history))w*=(m.multiplier||1);
        if(to===cur)w*=SAME; if(w>0)cand[to]=(cand[to]||0)+w;
      };
      for(const rule of (cdef.transitions||[]))consider(rule,cur+"→"+rule.to);
      for(const rule of G)consider(rule,"∀→"+rule.to);
      let sel; const keys=Object.keys(cand);
      if(!keys.length)sel=allowed(cdef,per)?cur:start;
      else{ let tot=0; for(const k of keys)tot+=cand[k]; let roll=rnd()*tot; sel=keys[keys.length-1];
        for(const k of keys){ roll-=cand[k]; if(roll<=0){sel=k;break;} } }
      if(sel!==cur)entries[sel]=(entries[sel]||0)+1;
      cur=sel; rem=randDur(S[sel].duration);
    }
    hour=(hour+1)%24;
  }
  const atmo2={}; for(const k in aStat){ const s=aStat[k]; atmo2[k]={min:s.min===Infinity?0:s.min,max:s.max===-Infinity?0:s.max,mean:s.sum/ticks,bound:B[k]||{}}; }
  const dead=[];
  const minAtt=Math.max(30,ticks/2000);
  for(const key in attempted){ const att=attempted[key], e=eligible[key]||0;
    let rule=null,glob=key.startsWith("∀→"); const to=key.split("→")[1]; const src=key.split("→")[0];
    const pool=glob?G:((S[src]&&S[src].transitions)||[]); for(const r of pool)if(r.to===to){rule=r;break;}
    const hasC=rule&&rule.conditions&&!isEmptyCond(rule.conditions);
    if(hasC&&att>=minAtt&&e/att<0.03)dead.push({src,to,pass:e/att,e,att,glob});
  }
  dead.sort((a,b)=>a.pass-b.pass);
  return {ticks,timeIn,entries,atmo:atmo2,dead};
}

function renderSim(main){
  main.append(el("div",{},el("h2",{class:"sec"},"Симуляция"),
    el("p",{class:"sec-lead"},"Прогон движка в браузере: 1 тик = 1 час, старт с полуночи, детерминированный seed. Показывает, куда реально сходится модель - распределение погод и равновесие атмосферы.")));
  const ticksIn=el("input",{type:"number",class:"num",value:"30000",step:"100",min:"1",style:{width:"120px"}});
  const out=el("div");
  const run=()=>{ let n=Math.round(Number(ticksIn.value)||30000); n=Math.max(1,Math.min(200000,n)); ticksIn.value=n;
    out.innerHTML=""; out.append(el("div",{class:"empty"},"считаю…"));
    setTimeout(()=>{ const r=simulate(n); drawSim(out,r); },10); };
  main.append(el("div",{class:"gtoolbar"},
    field("тиков (часов)",ticksIn),
    el("button",{class:"tbtn primary",style:{alignSelf:"flex-end"},onclick:run},"Прогнать"),
    el("span",{class:"hint",style:{alignSelf:"flex-end"}},"~1 час игрового времени = 1 тик крона")),
    out);
  run();
}
function drawSim(out,r){
  out.innerHTML="";
  if(r.error){ out.append(el("div",{class:"panel",style:{padding:"16px",borderColor:"var(--crit)"}},
    el("span",{class:"simbadge crit"},"нельзя симулировать"),el("p",{style:{marginTop:"8px",marginBottom:0}},r.error))); return; }
  const ids=Object.keys(r.timeIn).sort((a,b)=>r.timeIn[b]-r.timeIn[a]);
  const seen=ids.filter(id=>r.timeIn[id]>0).length, unreach=ids.filter(id=>r.entries[id]===0&&id!==MODEL.settings.defaultState&&r.timeIn[id]===0).length;
  const pinned=Object.keys(r.atmo).filter(k=>{ const a=r.atmo[k],b=a.bound; if(b.min==null||b.max==null||b.max<=b.min)return false; const f=(a.mean-b.min)/(b.max-b.min); return f<=0.12||f>=0.88; }).length;
  out.append(el("div",{class:"statrow"},
    stat(r.ticks.toLocaleString("ru"),"тиков"),
    stat(seen+" / "+ids.length,"погод встречено"),
    stat(String(unreach),"недостижимо",unreach?"crit":"ok"),
    stat(String(pinned),"переменных у границы",pinned?"warn":"ok")));
  // atmosphere
  const atmoPanel=el("div",{class:"panel",style:{padding:"16px"}},el("div",{class:"eyebrow"},"равновесие атмосферы"),
    el("p",{class:"sec-lead",style:{margin:"4px 0 12px"}},"Полоса - наблюдаемый диапазон в пределах границ, засечка - среднее. «Прижата к границе» = дельты несбалансированы (сумма по времени тянет в пол/потолок)."));
  for(const k in r.atmo)atmoPanel.append(atmoBar(k,r.atmo[k]));
  out.append(atmoPanel);
  // distribution
  const maxPct=Math.max(...ids.map(id=>r.timeIn[id]))/r.ticks*100||1;
  const distPanel=el("div",{class:"panel",style:{padding:"16px",marginTop:"14px"}},
    el("div",{class:"eyebrow"},"распределение состояний · доля времени"),
    el("div",{class:"sbar",style:{marginTop:"10px",color:"var(--muted)"}},
      el("span",{class:"tinyhead"},"состояние"),el("span",{class:"tinyhead"},""),el("span",{class:"tinyhead",style:{textAlign:"right"}},"% времени"),el("span",{class:"tinyhead",style:{textAlign:"right"}},"входов")));
  ids.forEach(id=>{ const d=MODEL.states[id],pct=r.timeIn[id]/r.ticks*100,fill=nodeFill(d);
    const rare=r.timeIn[id]===0?"crit":(pct<0.1?"warn":null);
    distPanel.append(el("div",{class:"sbar"},
      el("span",{class:"id"},el("span",{class:"sw",style:{background:fill}}),id,
        rare==="crit"?el("span",{class:"simbadge crit"},"нет"):(rare==="warn"?el("span",{class:"simbadge warn"},"редко"):null)),
      el("div",{class:"track"},el("div",{class:"fill",style:{width:Math.max(0.5,pct/maxPct*100)+"%",background:fill,opacity:.85}})),
      el("span",{class:"pct"},pct.toFixed(2)+"%"),
      el("span",{class:"pct",style:{color:"var(--muted)"}},String(r.entries[id]))));
  });
  out.append(distPanel);
  // dead conditions
  if(r.dead.length){ const dp=el("div",{class:"panel",style:{padding:"16px",marginTop:"14px"}},
      el("div",{class:"eyebrow"},"условия, которые почти никогда не проходят"),
      el("p",{class:"sec-lead",style:{margin:"4px 0 10px"}},"Переход достижим по правилу, но его условие выполняется <3% попыток - цель практически недостижима этим путём."));
    r.dead.slice(0,24).forEach(x=>dp.append(el("div",{class:"sbar",style:{gridTemplateColumns:"1fr 90px 90px"}},
      el("span",{class:"id"},(x.glob?"∀":x.src)+" → "+x.to),
      el("span",{class:"pct",style:{color:"var(--warn)"}},(x.pass*100).toFixed(2)+"%"),
      el("span",{class:"pct",style:{color:"var(--muted)"}},x.e+"/"+x.att))));
    out.append(dp);
  }
}
function stat(v,l,cls){ return el("div",{class:"stat"},el("div",{class:"v",style:cls?{color:"var(--"+(cls==="crit"?"crit":cls==="warn"?"warn":"ok")+")"}:{}},v),el("div",{class:"l"},l)); }
function atmoBar(name,a){
  const b=a.bound, has=b.min!=null&&b.max!=null&&b.max>b.min;
  const pct=x=>has?Math.max(0,Math.min(100,(x-b.min)/(b.max-b.min)*100)):50;
  const lo=pct(a.min),hi=pct(a.max),mp=pct(a.mean);
  let status="-",cls="ok";
  if(has){ const f=(a.mean-b.min)/(b.max-b.min);
    if(f<=0.12){status="прижата к полу";cls="crit";} else if(f>=0.88){status="прижата к потолку";cls="crit";}
    else if(f<=0.25){status="дрейф вниз";cls="warn";} else if(f>=0.75){status="дрейф вверх";cls="warn";} else status="стабильна"; }
  return el("div",{class:"abar"},
    el("span",{class:"name"},name),
    el("div",{class:"track"},
      el("div",{class:"band",style:{left:Math.min(lo,hi)+"%",width:Math.max(1.5,Math.abs(hi-lo))+"%"}}),
      el("div",{class:"mean",style:{left:mp+"%"}})),
    el("span",{class:"nums"},a.min.toFixed(2)+" · "+a.mean.toFixed(2)+" · "+a.max.toFixed(2)),
    el("span",{style:{textAlign:"right"}},el("span",{class:"simbadge "+cls},status)));
}

/* ---------- commit / io ---------- */
let softTimer=null, graphDirty=false;
function softCommit(affectsGraph){ if(affectsGraph)graphDirty=true;
  clearTimeout(softTimer);
  softTimer=setTimeout(()=>{ const {errs,warns}=validate(); renderBadge(errs,warns); renderVlist(errs,warns); renderNav();
    if(graphDirty&&TAB==="graph"){ graphDirty=false; render(); } },180);
}
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove("show"),1900); }
/* inline modals - sandboxed artifacts block window.prompt/confirm */
function modal(build){ return new Promise(resolve=>{
  const ov=el("div",{class:"modal-ov"}), box=el("div",{class:"modal"}); let done=false;
  const finish=v=>{ if(done)return; done=true; ov.classList.remove("show"); document.removeEventListener("keydown",esc); setTimeout(()=>ov.remove(),140); resolve(v); };
  function esc(e){ if(e.key==="Escape")finish(null); }
  ov.append(box); document.body.append(ov); requestAnimationFrame(()=>ov.classList.add("show"));
  ov.addEventListener("mousedown",e=>{ if(e.target===ov)finish(null); });
  document.addEventListener("keydown",esc);
  build(box,finish);
});}
function askText(title,initial){ return modal((box,finish)=>{
  const inp=el("input",{type:"text",value:initial||""});
  box.append(el("h3",{},title),inp,el("div",{class:"actions"},
    el("button",{class:"tbtn ghost",onclick:()=>finish(null)},"Отмена"),
    el("button",{class:"tbtn primary",onclick:()=>finish(inp.value)},"OK")));
  inp.addEventListener("keydown",e=>{ if(e.key==="Enter")finish(inp.value); });
  setTimeout(()=>{inp.focus();inp.select();},30);
});}
function askConfirm(title,msg,okLabel){ return modal((box,finish)=>{
  box.append(el("h3",{},title),msg?el("p",{},msg):null,el("div",{class:"actions"},
    el("button",{class:"tbtn ghost",onclick:()=>finish(false)},"Отмена"),
    el("button",{class:"tbtn primary",style:{background:"var(--crit)",borderColor:"var(--crit)"},onclick:()=>finish(true)},okLabel||"Удалить")));
});}
function copy(text){ navigator.clipboard?.writeText(text).then(()=>toast("Скопировано в буфер"),()=>toast("Не удалось скопировать")); }
function download(text){ const blob=new Blob([text],{type:"application/json"}); const url=URL.createObjectURL(blob);
  const a=el("a",{href:url,download:"weather-system.json"}); document.body.append(a); a.click(); a.remove(); URL.revokeObjectURL(url); toast("Файл сохранён"); }
function importJson(text,name){ try{ MODEL=normalize(JSON.parse(text)); SELECTED=null; if(name)$("#filelabel").textContent=name; render(); toast("Загружено: "+(name||"из буфера")); }
  catch(e){ toast("Ошибка JSON: "+e.message); } }

/* ---------- theme ---------- */
function initTheme(){
  const saved=null; // sessionStorage may be unavailable; default to system
  $("#btn-theme").addEventListener("click",()=>{
    const cur=document.documentElement.getAttribute("data-theme");
    const sysDark=matchMedia("(prefers-color-scheme:dark)").matches;
    const next = cur ? (cur==="dark"?"light":"dark") : (sysDark?"light":"dark");
    document.documentElement.setAttribute("data-theme",next); if(TAB==="graph")render();
  });
}

/* ---------- wire ---------- */
$("#btn-export").addEventListener("click",()=>{ TAB="json"; render(); window.scrollTo(0,0); });
$("#btn-reset").addEventListener("click",()=>{ askConfirm("Загрузить встроенный пример?","Текущие правки будут потеряны.","Загрузить").then(ok=>{ if(ok){ MODEL=normalize(loadDefault()); SELECTED=null; $("#filelabel").textContent="weather-system.json"; render(); } }); });
$("#btn-import").addEventListener("click",()=>$("#fileinput").click());
$("#fileinput").addEventListener("change",e=>{ const f=e.target.files[0]; if(!f)return; const r=new FileReader(); r.onload=()=>importJson(r.result,f.name); r.readAsText(f); e.target.value=""; });
initTheme();
boot();
