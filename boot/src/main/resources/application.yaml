spring:
  application:
    name: irden-proxy
  datasource:
    url: jdbc:postgresql://localhost:15432/starryspring
    username: postgres
    password: postgres
  liquibase:
    enabled: false
  messages:
    encoding: UTF-8
    basename: messages
  web:
    locale: ru


starry:
  plugins:
    directory: runtime-plugins
    # Папка с внешними конфигами плагинов: <config-directory>/<plugin-id>.yaml
    # её нужно случайно не снести
    config-directory: config/plugins


proxy:
  listen-host: 0.0.0.0
  listen-port: 7777
  upstream-host: localhost
  upstream-port: 21024

  max-packet-payload-bytes: 33554432

assets:
  store:
    enabled: false
    archives: [ ]
    excluded-extensions:
      - .ogg
      - .png
      - .wav

logging:
  level:
    root: INFO
    irden.space.proxy.application: INFO
  file:
    name: logs/starry.log
  logback:
    rollingpolicy:
      file-name-pattern: logs/starry.%d{yyyy-MM-dd}.%i.log.gz
      max-file-size: 20MB
      max-history: 14
      total-size-cap: 2GB

management:
  endpoints:
    web:
      exposure:
        include:
          - beans
          - health
          - mappings
          - env
  endpoint:
    health:
      show-details: always
