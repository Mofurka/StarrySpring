# Дефолтный конфиг плагина template.
# Имя ресурса = config/<plugin-id>.yaml (уникально
template:
  greeting: "Hello from the template plugin"
  feature-enabled: true
  max-items: 10

logging:
  file: logs/plugins/template.log
  level: DEBUG
  logger: irden.space.proxy.plugin.template
  additive: true
  pattern: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{40} - %msg%n"
  max-file-size: 10MB
  max-history: 7
  total-size-cap: 1GB
  clean-history-on-start: false
