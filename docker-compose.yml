services:
  server:
    image: irden.offline/starry-spring:latest
    restart: always

    stop_signal: SIGTERM
    stop_grace_period: 1m

    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - LOCALE=ru

    ports:
      - "7778:7777"

    volumes:
      - ./runtime-plugins:/server/runtime-plugins:ro
      - ./config:/server/config
      - ./StarboundServer:/server/game

    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - irden

  postgres:
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: starryspring
    ports:
      - "15432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}" ]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - irden

volumes:
  db_data:
networks:
  irden: